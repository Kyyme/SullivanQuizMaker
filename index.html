<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kinetiq</title>

    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <div id="app">

        <!-- ========================= -->
        <!-- DASHBOARD -->
        <!-- ========================= -->

        <div id="dashboard" class="view active">

            <h1>Kinetiq Prep Reviewer</h1>

            <div id="quiz-groups">
                <div class="quiz-folder">
                    <h3 class="folder-title"> Select a Quiz Set</h3>
                <div id="quiz-list"></div>
                </div>
            </div>

        </div>
        <!-- SUBJECT SCREEN -->
        <div id="subject-screen" class="view">

            
            <button
                id="subject-back-btn"
                class="back-button">
                ← Back to Dashboard
            </button>

            <h2 id="subject-title">
                Subject
            </h2>

            <div id="subject-quiz-list"></div>

        </div>
        

        <!-- ========================= -->
        <!-- QUIZ SCREEN -->
        <!-- ========================= -->

        <div id="quiz-screen" class="view">

            <!-- Top Controls -->

            <button
                id="back-btn"
                class="back-button">
                ← Back to Dashboard
            </button>

            <h2 id="quiz-title">
                Quiz Title
            </h2>

            <!-- Question Numbers -->

            <div id="question-nav">
                <!-- Generated by JS -->
            </div>

            <!-- Question Area -->

            <div id="question-container">

                <h3 id="question-stem">
                    Question goes here...
                </h3>

                <div id="options-container">

                    <!-- Generated by JS -->

                </div>

            </div>

            <!-- Rationales -->

            <div id="rationale-container" class="hidden">

                <h4>
                    Correct Answer:
                    <span id="correct-answer-letter"></span>
                </h4>

                <p>
                    <strong>Rationale:</strong>
                    <span id="correct-rationale"></span>
                </p>

                <p>
                    <strong>Incorrect Choices:</strong>
                    <span id="incorrect-rationale"></span>
                </p>

            </div>

            <!-- Previous / Next -->

            <div class="navigation-buttons">

                <button id="prev-btn">
                    ← Previous
                </button>

                <button id="next-btn">
                    Next →
                </button>

            </div>

        </div>

    </div>

    <!-- Question Bank -->

    <script src="data.js"></script>
    <script src="new_data.js"></script>
    <!-- Main App -->

    <script src="script.js"></script>

</body>
</html>
